[package]
name = "deerpunk-engine-client-fmod"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
deerpunk-engine-client = { path = "../client" }
log.workspace = true
libfmod = { git = "https://github.com/GageHowe/libfmod" }
audionimbus = { version = "0.11", features = ["auto-install"] }
audionimbus-sys = { version = "4.8", features = ["auto-install"] }
glam = "0.33"
libloading = "0.8"
deerpunk-engine-common = { path = "../common" }
