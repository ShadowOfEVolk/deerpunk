[package]
name = "deerpunk-engine-client"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
deerpunk-engine-common = { path = "../common" }
deerpunk-engine-renderer = { path = "../renderer" }
deerpunk-ui = { path = "../../crates/ui" }
rand = "0.8"
glam = "0.33"
sdl2 = { version = "0.37", features = ["raw-window-handle"] }
raw-window-handle.workspace = true
wgpu.workspace = true
log.workspace = true
