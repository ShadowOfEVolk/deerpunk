[package]
name = "deerpunk-engine-common"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
once_cell = "1.19"
paste = "1.0"
glam = { version = "0.33", features = ["serde"] }
hecs = "0.11"
serde_json = "1"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
handlebars = "6"
bincode = "1.3"
rapier3d = { version = "0.35", features = ["dim3", "profiler"] }
memmap2 = "0.9"
interprocess = "2"

[build-dependencies]
cc = "1"
