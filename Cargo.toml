[workspace]
members = [
    "engine/core",
    "engine/common",
    "engine/server",
    "engine/client",
]
resolver = "2"

[package]
name = "deerpunk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deerpunk"
path = "src/main.rs"

[dependencies]
deerpunk-engine-core = { path = "engine/core", features = ["full"] }
deerpunk-engine-client = { path = "engine/client" }
hecs = "0.11"
