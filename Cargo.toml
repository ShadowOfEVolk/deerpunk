[workspace]
members = [
    "crates/engine-api",
    "crates/engine-client",
    "crates/engine-client-fmod",
    "crates/engine-client-kira",
    "crates/engine-common",
    "crates/engine-world",
    "crates/engine-network",
    "crates/engine-resource",
    "crates/engine-ffi",
    "crates/engine-host",
    "crates/engine-inspector-protocol",
    "crates/engine-macro",
    "crates/engine-renderer",
    "crates/engine-particles",
    "crates/engine-server",
    "crates/engine-ui",
    "crates/sdk-client",
    "crates/sdk-common",
    "crates/sdk-macro",
]
resolver = "2"

[workspace.dependencies]
log = "0.4"
fern = "0.7"
wgpu = "30"
tiny-skia = "0.11"
pollster = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"
[package]
name = "deerpunk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deerpunk"
path = "src/main.rs"

[features]
default = ["full"]
full = ["deerpunk-engine-host/full"]
full-kira = ["deerpunk-engine-host/full-kira"]
tracy = ["deerpunk-engine-host/tracy", "deerpunk-engine-renderer/tracy"]
puffin = ["deerpunk-engine-host/puffin", "deerpunk-engine-renderer/puffin"]

[dependencies]
deerpunk-engine-host = { path = "crates/engine-host", default-features = false }
deerpunk-engine-common = { path = "crates/engine-common" }
deerpunk-engine-client = { path = "crates/engine-client" }
deerpunk-engine-renderer = { path = "crates/engine-renderer" }
deerpunk-engine-particles = { path = "crates/engine-particles" }
log = { workspace = true }
wgpu = "30"
glam = "0.33"

inventory = "0.3"
libloading = "0.8"
image = "0.25"

# Vendored sdl2-sys: adds CMAKE_POLICY_VERSION_MINIMUM for bundled SDL2 + CMake 4.x (see third_party README).
[patch.crates-io]
sdl2-sys = { path = "third_party/sdl2-sys-0.37.0-patched" }
