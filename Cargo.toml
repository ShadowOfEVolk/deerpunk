[workspace]
members = [
    "crates/host",
    "crates/common",
    "crates/server",
    "crates/client",
    "crates/client-fmod",
    "crates/renderer",
    "crates/sdk-common",
    "crates/sdk-client",
    "crates/engine-api",
    "crates/ui",
    "crates/inspector-protocol",
]
resolver = "2"

[workspace.dependencies]
log = "0.4"
fern = "0.7"
wgpu = "30"
tiny-skia = "0.11"
pollster = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"
imgui = "0.12"
imgui-wgpu = { path = "C:/Users/elekt/dev/imgui-wgpu-rs" }

[package]
name = "deerpunk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deerpunk"
path = "src/main.rs"

[dependencies]
deerpunk-engine-host = { path = "crates/host", features = ["full"] }
deerpunk-engine-common = { path = "crates/common" }
deerpunk-engine-client = { path = "crates/client" }
deerpunk-engine-renderer = { path = "crates/renderer" }
log = { workspace = true }
wgpu = "30"
glam = "0.33"

inventory = "0.3"
libloading = "0.8"
image = "0.25"
