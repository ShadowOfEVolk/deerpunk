[workspace]
members = [
    "crates/engine-api",
    "crates/engine-client",
    "crates/engine-client-fmod",
    "crates/engine-client-kira",
    "crates/engine-common",
    "crates/engine-network",
    "crates/engine-resource",
    "crates/engine-ffi",
    "crates/engine-host",
    "crates/engine-inspector-protocol",
    "crates/engine-macro",
    "crates/engine-renderer",
    "crates/engine-server",
    "crates/engine-ui",
    "crates/sdk-client",
    "crates/sdk-common",
    "crates/sdk-macro",
]
resolver = "2"

[workspace.dependencies]
log = "0.4"
fern = "0.7"
wgpu = "30"
tiny-skia = "0.11"
pollster = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"
imgui = "0.12"
imgui-wgpu = { path = "C:/Users/elekt/dev/imgui-wgpu-rs" }

[package]
name = "deerpunk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deerpunk"
path = "src/main.rs"

[features]
default = ["full"]
full = ["deerpunk-engine-host/full"]
full-kira = ["deerpunk-engine-host/full-kira"]

[dependencies]
deerpunk-engine-host = { path = "crates/engine-host", default-features = false }
deerpunk-engine-common = { path = "crates/engine-common" }
deerpunk-engine-client = { path = "crates/engine-client" }
deerpunk-engine-renderer = { path = "crates/engine-renderer" }
log = { workspace = true }
wgpu = "30"
glam = "0.33"

inventory = "0.3"
libloading = "0.8"
image = "0.25"
