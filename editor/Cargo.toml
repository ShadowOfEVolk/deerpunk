[package]
name = "deerpunk-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
deerpunk-engine-common = { path = "../engine/common" }
iced = { version = "0.14", features = ["wgpu", "image", "tokio"] }
wgpu = "27"
memmap2 = "0.9"
parking_lot = "0.12"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Security",
] }
