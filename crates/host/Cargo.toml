[package]
name = "deerpunk-engine-host"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
deerpunk-engine-common = { path = "../common" }
deerpunk-engine-api = { path = "../engine-api" }
deerpunk-engine-server = { path = "../server", optional = true }
deerpunk-engine-client = { path = "../client", optional = true }
deerpunk-engine-client-fmod = { path = "../client-fmod", optional = true }
deerpunk-ui = { path = "../ui", optional = true }

log = { workspace = true }
glam = "0.33"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imgui = "0.12"
inventory = "0.3"
libloading = "0.8"
image = "0.25"
deerpunk-inspector-protocol = { path = "../inspector-protocol" }
sha1 = "0.10"
base64 = "0.22"
renet = "2.0"
renet_netcode = "2.0"
renetcode = "2.0"
socket2 = "0.5"

[features]
default = ["full"]
dedicated-server = ["deerpunk-engine-server"]
client = ["deerpunk-engine-client", "deerpunk-engine-client-fmod", "deerpunk-engine-server", "deerpunk-ui"]
full = ["deerpunk-engine-server", "deerpunk-engine-client", "deerpunk-engine-client-fmod", "deerpunk-ui"]
