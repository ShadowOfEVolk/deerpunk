[package]
name = "deerpunk-engine-client"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
deerpunk-engine-common = { path = "../engine-common" }
deerpunk-engine-server = { path = "../engine-server" }
deerpunk-engine-ffi = { path = "../engine-ffi" }
deerpunk-engine-renderer = { path = "../engine-renderer" }
deerpunk-ui = { path = "../engine-ui" }
rand = "0.8"
glam = "0.33"
# `bundled` builds real SDL2 — required on macOS if system lib is `sdl2-compat` (SDL3 shim):
# it emits event types (e.g. 0x207) that rust-sdl2/SDL2 bindings don't know → panic in event.rs.
sdl2 = { version = "0.37", features = ["bundled", "raw-window-handle"] }
raw-window-handle.workspace = true
wgpu.workspace = true
log.workspace = true
image = "0.25"
inventory = "0.3"
crossbeam-channel = "0.5"
libloading = "0.8"
serde_json = "1"
