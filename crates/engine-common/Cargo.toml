[package]
name = "deerpunk-engine-common"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
deerpunk-engine-ffi = { path = "../engine-ffi" }
deerpunk-engine-network = { path = "../engine-network" }
deerpunk-engine-resource = { path = "../engine-resource" }
log = { workspace = true }
fern = { workspace = true }
glam = { version = "0.33", features = ["serde"] }

serde_json = "1"
ciborium = "0.2"
json_comments = "0.2"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
bitflags = "2"
handlebars = "6"
bincode = "1.3"
rapier3d = { version = "0.35", features = ["dim3", "profiler"] }
image = "0.25"
rand = "0.8"
socket2 = "0.5"
flecs_ecs_sys = { git = "https://github.com/Indra-db/Flecs-Rust.git", default-features = false, features = ["flecs_meta_c", "flecs_alerts", "flecs_json"] }

[build-dependencies]
cc = "1"
bindgen = "0.71"
