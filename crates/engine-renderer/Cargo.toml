[package]
name = "deerpunk-engine-renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
deerpunk-engine-common = { path = "../engine-common" }
deerpunk-engine-ffi = { path = "../engine-ffi" }
inventory = "0.3"
glam = { version = "0.33", features = ["serde"] }
tiny-skia.workspace = true
wgpu.workspace = true
naga = "30"
pollster.workspace = true
bytemuck.workspace = true
log.workspace = true
raw-window-handle.workspace = true
tracy-client = { version = "0.19", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
] }
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }

[[bench]]
name = "mesh_batch"
harness = false

[[bench]]
name = "chunk_vis"
harness = false

[features]
tracy = ["dep:tracy-client"]
puffin = ["dep:puffin", "dep:puffin_http"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Security",
] }

[build-dependencies]
cc = "1"
