[package]
name = "deerpunk-engine-sdk"
version = "0.1.0"
edition = "2021"
description = "Gamelib SDK (typed engine API + FFI re-exports)"

[dependencies]
deerpunk-engine-api = { path = "../engine-api" }
deerpunk-engine-common = { path = "../common" }
deerpunk-engine-ffi = { path = "../engine-ffi" }
deerpunk-sdk-macro = { path = "../sdk-macro" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
log = "0.4"
inventory = "0.3"

[lib]
path = "lib.rs"
